name: "pulpcore.CI"

services:
  pulp:
    build:
      context: ../..
      dockerfile: ".ci/compose/Containerfile"
      args:
        - EXTRA_INSTALL=${EXTRA_INSTALL}
        - PACKAGE_SRC=${PACKAGE_SRC}
        - CLIENT_SRC=${CLIENT_SRC}
        - FULL_INSTALL=${FULL_INSTALL}
        - TEST=${TEST}
    image: "localhost/pulp-ci:${COMPOSE_PROJECT_NAME}"
    ports:
      - "5003:443"
    healthcheck:
      test: "curl -f http://localhost:24817${PULP_API_ROOT:-/pulp/}api/v3/status/"
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      PULP_WORKERS: "4"
      PULP_HTTPS: "true"
      PULP_CA_BUNDLE: "/etc/pulp/certs/pulp_webserver.crt"

    volumes:
      - "pulp:/var/lib/pulp"
      - "redis_data:/data"
      - "pg_data:/var/lib/pgsql"

volumes:
  pulp:
    name: "${COMPOSE_PROJECT_NAME}_pulp"
  pg_data:
    name: "${COMPOSE_PROJECT_NAME}_pg_data"
  redis_data:
    name: "${COMPOSE_PROJECT_NAME}_redis_data"
---
name: "Build"
on:
  workflow_call:

defaults:
  run:
    working-directory: "pulpcore"

jobs:
  build:
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 1
          path: "pulpcore"
      - uses: "actions/checkout@v4"
        with:
          fetch-depth: 1
          repository: "pulp/pulp-openapi-generator"
          path: "pulp-openapi-generator"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.11"
      - name: "Install python dependencies"
        run: |
          echo ::group::PYDEPS
          pip install build packaging twine wheel mkdocs jq
          echo ::endgroup::
      - name: "Build package"
        run: |
          make build
      - name: "Install built packages"
        run: |
          pip install dist/pulpcore-*-py3-none-any.whl -c .ci/assets/ci_constraints.txt
      - name: "Generate api specs"
        run: |
          make openapi
          make openapi TEST="azure"
          make openapi TEST="s3"
          make openapi TEST="lowerbounds"
      - name: "Upload Package whl"
        uses: "actions/upload-artifact@v4"
        with:
          name: "plugin_package"
          path: "pulpcore/dist/"
          if-no-files-found: "error"
          retention-days: 5
          overwrite: true
      - name: "Upload API specs"
        uses: "actions/upload-artifact@v4"
        with:
          name: "api_spec"
          path: |
            pulpcore/.ci/compose/*/api.json
            pulpcore/.ci/compose/*/core-api.json
            pulpcore/.ci/compose/*/file-api.json
            pulpcore/.ci/compose/*/certguard-api.json
          if-no-files-found: "error"
          retention-days: 5
          overwrite: true
      - name: "Build Python bindings packages"
        run: |
          make bindings TEST="pulp"
          make bindings TEST="azure"
          make bindings TEST="s3"
          make bindings TEST="lowerbounds"
          # Only need to build docs for the pulp test.
          make bindings-docs TEST="pulp"
      - name: "Upload python client packages"
        uses: "actions/upload-artifact@v4"
        with:
          name: "python-client.tar"
          path: |
            pulpcore/.ci/compose/*/pulpcore_client-*
            pulpcore/.ci/compose/*/pulp_file_client-*
            pulpcore/.ci/compose/*/pulp_certguard_client-*
          if-no-files-found: "error"
          retention-days: 5
          overwrite: true
      - name: "Upload python client docs"
        uses: "actions/upload-artifact@v4"
        with:
          name: "python-client-docs.tar"
          path: |
            pulpcore/.ci/compose/*/core-python-client-docs.tar
            pulpcore/.ci/compose/*/file-python-client-docs.tar
            pulpcore/.ci/compose/*/certguard-python-client-docs.tar
          if-no-files-found: "error"
          retention-days: 5
          overwrite: true
      - name: "Build Ruby bindings packages"
        run: |
          make bindings TEST="pulp" TYPE="ruby"
      - name: "Upload Ruby client"
        uses: "actions/upload-artifact@v4"
        with:
          name: "ruby-client.tar"
          path: |
            pulpcore/.ci/compose/pulp/pulpcore_client-*.gem
            pulpcore/.ci/compose/pulp/pulp_file_client-*.gem
            pulpcore/.ci/compose/pulp/pulp_certguard_client-*.gem
          if-no-files-found: "error"
          retention-days: 5
          overwrite: true
...
